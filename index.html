<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Broschüre</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  body{
    background:#111;
    color:#fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .wrap{
    width: min(1600px, 100%);
    padding: 12px;
    box-sizing: border-box;
  }
  .stage{ display:flex; justify-content:center; }
  canvas{
    display:block;
    background:#fff;
    border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
    max-width: 100%;
    max-height: calc(100vh - 140px);
  }
  .controls{
    position: sticky;
    bottom: 12px;
    margin-top: 12px;
    display:flex;
    gap:12px;
    justify-content:center;
    align-items:center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 12px 16px;
    border-radius: 999px;
    z-index: 10;
  }
  button{
    background:#fff;
    border:0;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
  }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .counter{ font-variant-numeric: tabular-nums; }
</style>
</head>

<body>
  <div class="wrap">
    <div class="stage"><canvas id="pdf"></canvas></div>
    <div class="controls">
      <button id="prev">◀</button>
      <div class="counter"><span id="page-num">1</span> / <span id="page-count">?</span></div>
      <button id="next">▶</button>
    </div>
  </div>

<script>
  const PDF_FILE = 'broschuere_cleaning_station_chantal_weis.pdf?v=7';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let pdfDoc = null;
  let pageNum = 1;

  const canvas = document.getElementById('pdf');
  const ctx = canvas.getContext('2d', { alpha: false });

  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const pageNumEl = document.getElementById('page-num');
  const pageCountEl = document.getElementById('page-count');

  // 🔧 Auto: Handy = whole page, Desktop = fit width
  function isMobile() {
    return window.matchMedia("(max-width: 768px)").matches;
  }

  // Schärfe: Handy ein bisschen höher (weil kleiner Screen), Desktop normal
  function qualityBoost() {
    return isMobile() ? 2.0 : 1.6;  // bei ruckeln auf Handy -> 1.6
  }

  function getDisplayScale(page){
    const v1 = page.getViewport({ scale: 1 });

    const maxWidth = Math.min(1600, window.innerWidth) - 24;
    const maxHeight = window.innerHeight - 170;

    const scaleByWidth = maxWidth / v1.width;
    const scaleByHeight = maxHeight / v1.height;

    if (isMobile()) {
      // Handy: komplette Seite sichtbar
      return Math.min(scaleByWidth, scaleByHeight);
    } else {
      // Desktop: maximal breit (aber nicht höher als Screen)
      return Math.min(scaleByWidth, scaleByHeight);
      // Wenn du Desktop wirklich "fit width" erzwingen willst:
      // return Math.min(scaleByWidth, scaleByHeight);
    }
  }

  async function renderPage(num){
    const page = await pdfDoc.getPage(num);

    const displayScale = getDisplayScale(page);
    const displayViewport = page.getViewport({ scale: displayScale });

    // Rendern in höherer Auflösung für Schärfe
    const renderScale = displayScale * qualityBoost();
    const renderViewport = page.getViewport({ scale: renderScale });

    const dpr = window.devicePixelRatio || 1;

    canvas.width  = Math.floor(renderViewport.width * dpr);
    canvas.height = Math.floor(renderViewport.height * dpr);

    canvas.style.width  = Math.floor(displayViewport.width) + "px";
    canvas.style.height = Math.floor(displayViewport.height) + "px";

    // Transform: DPR + Downscale Render->Display
    const sx = (renderViewport.width / displayViewport.width) * dpr;
    const sy = (renderViewport.height / displayViewport.height) * dpr;
    ctx.setTransform(sx, 0, 0, sy, 0, 0);

    await page.render({ canvasContext: ctx, viewport: displayViewport }).promise;

    pageNumEl.textContent = num;
    prevBtn.disabled = (num <= 1);
    nextBtn.disabled = (num >= pdfDoc.numPages);
  }

  (async () => {
    pdfDoc = await pdfjsLib.getDocument(PDF_FILE).promise;
    pageCountEl.textContent = pdfDoc.numPages;
    await renderPage(pageNum);
  })();

  prevBtn.addEventListener('click', async () => {
    if(pageNum <= 1) return;
    pageNum--;
    await renderPage(pageNum);
  });

  nextBtn.addEventListener('click', async () => {
    if(pageNum >= pdfDoc.numPages) return;
    pageNum++;
    await renderPage(pageNum);
  });

  window.addEventListener('resize', () => {
    if(pdfDoc) renderPage(pageNum);
  });
</script>
</body>
</html>
