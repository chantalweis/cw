<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Cleaning Station – Chantal Weis</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #e9e9e6;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e9e9e6;
      overflow: hidden;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    #pageImage {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transform-origin: center center;
      transition: opacity 0.18s ease;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="stage" id="stage">
      <img id="pageImage" src="seite__Seite_01.jpg" alt="Broschürenseite" />
    </div>
  </div>

  <script>
    let currentPage = 1;
    const totalPages = 35;

    const img = document.getElementById("pageImage");
    const stage = document.getElementById("stage");

    function formatNumber(num) {
      return String(num).padStart(2, "0");
    }

    function getPageSrc(page) {
      return `seite__Seite_${formatNumber(page)}.jpg`;
    }

    function preloadAdjacentPages() {
      const next = currentPage + 1;
      const prev = currentPage - 1;

      if (next <= totalPages) {
        const i1 = new Image();
        i1.src = getPageSrc(next);
      }
      if (prev >= 1) {
        const i2 = new Image();
        i2.src = getPageSrc(prev);
      }
    }

    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    function applyTransform() {
      img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform();
    }

    function clampPan() {
      if (scale <= 1) {
        translateX = 0;
        translateY = 0;
        return;
      }

      const scaledWidth = img.clientWidth * scale;
      const scaledHeight = img.clientHeight * scale;

      const maxX = Math.max((scaledWidth - window.innerWidth) / 2, 0);
      const maxY = Math.max((scaledHeight - window.innerHeight) / 2, 0);

      translateX = Math.min(Math.max(translateX, -maxX), maxX);
      translateY = Math.min(Math.max(translateY, -maxY), maxY);
    }

    function updatePage() {
      img.style.opacity = 0;

      setTimeout(() => {
        img.src = getPageSrc(currentPage);
      }, 100);
    }

    img.addEventListener("load", () => {
      resetZoom();
      img.style.opacity = 1;
      preloadAdjacentPages();
    });

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        updatePage();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        updatePage();
      }
    }

    // Klick links/rechts
    let mouseDownX = 0;
    let mouseDownY = 0;
    let mouseMoved = false;

    document.addEventListener("mousedown", (e) => {
      mouseDownX = e.clientX;
      mouseDownY = e.clientY;
      mouseMoved = false;
    });

    document.addEventListener("mousemove", (e) => {
      if (Math.abs(e.clientX - mouseDownX) > 8 || Math.abs(e.clientY - mouseDownY) > 8) {
        mouseMoved = true;
      }
    });

    document.addEventListener("click", (e) => {
      if (mouseMoved || scale > 1) return;

      const half = window.innerWidth / 2;
      if (e.clientX > half) {
        nextPage();
      } else {
        prevPage();
      }
    });

    // Touch / Swipe / Pinch
    let touchStartX = 0;
    let touchStartY = 0;

    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let startTranslateX = 0;
    let startTranslateY = 0;

    let initialPinchDistance = null;
    let initialScale = 1;

    function getDistance(t1, t2) {
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    stage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;

        if (scale > 1) {
          isDragging = true;
          dragStartX = e.touches[0].clientX;
          dragStartY = e.touches[0].clientY;
          startTranslateX = translateX;
          startTranslateY = translateY;
        }
      }

      if (e.touches.length === 2) {
        initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
        initialScale = scale;
        isDragging = false;
      }
    }, { passive: false });

    stage.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const newDistance = getDistance(e.touches[0], e.touches[1]);
        scale = initialScale * (newDistance / initialPinchDistance);
        scale = Math.max(1, Math.min(scale, 5));
        clampPan();
        applyTransform();
      }

      if (e.touches.length === 1 && scale > 1 && isDragging) {
        e.preventDefault();
        translateX = startTranslateX + (e.touches[0].clientX - dragStartX);
        translateY = startTranslateY + (e.touches[0].clientY - dragStartY);
        clampPan();
        applyTransform();
      }
    }, { passive: false });

    stage.addEventListener("touchend", (e) => {
      if (initialPinchDistance && e.touches.length < 2) {
        initialPinchDistance = null;
      }

      if (scale > 1) {
        isDragging = false;
        return;
      }

      if (e.changedTouches.length === 1) {
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;

        const diffX = touchStartX - endX;
        const diffY = touchStartY - endY;

        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
          if (diffX > 0) nextPage();
          else prevPage();
          return;
        }

        const tapDistance = Math.sqrt(
          Math.pow(endX - touchStartX, 2) + Math.pow(endY - touchStartY, 2)
        );

        if (tapDistance < 10) {
          const half = window.innerWidth / 2;
          if (endX > half) nextPage();
          else prevPage();
        }
      }
    });

    document.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();

      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      scale = Math.max(1, Math.min(scale * factor, 5));
      clampPan();
      applyTransform();
    }, { passive: false });

    document.addEventListener("dblclick", (e) => {
      e.preventDefault();
      if (scale === 1) {
        scale = 2;
      } else {
        resetZoom();
      }
      clampPan();
      applyTransform();
    });

    document.addEventListener("keydown", (e) => {
      if (scale === 1) {
        if (e.key === "ArrowRight") nextPage();
        if (e.key === "ArrowLeft") prevPage();
      }

      if (e.key === "+" || e.key === "=") {
        scale = Math.min(scale * 1.15, 5);
        clampPan();
        applyTransform();
      }

      if (e.key === "-") {
        scale = Math.max(scale / 1.15, 1);
        clampPan();
        applyTransform();
      }

      if (e.key === "0") {
        resetZoom();
      }
    });

    img.src = getPageSrc(currentPage);
  </script>
</body>
</html>
