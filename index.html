<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Broschüre</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
  html, body { height: 100%; margin: 0; }
  body{
    background:#111;
    color:#fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
  }
  .wrap{
    width:min(1200px, 100%);
    padding:20px;
    box-sizing:border-box;
  }
  .stage{
    display:flex;
    justify-content:center;
  }
  canvas{
    display:block;
    background:#fff;
    border-radius:12px;
    box-shadow:0 20px 50px rgba(0,0,0,0.6);
  }
  .controls{
    position: sticky;
    bottom: 20px;
    margin-top: 16px;
    display:flex;
    gap:12px;
    justify-content:center;
    align-items:center;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    padding: 12px 18px;
    border-radius: 999px;
    z-index: 10;
  }
  button{
    background:#fff;
    border:0;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    font-weight:700;
  }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  .counter{ font-variant-numeric: tabular-nums; }
</style>
</head>

<body>
  <div class="wrap">
    <div class="stage">
      <canvas id="pdf"></canvas>
    </div>

    <div class="controls">
      <button id="prev">◀</button>
      <div class="counter"><span id="page-num">1</span> / <span id="page-count">?</span></div>
      <button id="next">▶</button>
    </div>
  </div>

<script>
  // ✅ Dateiname exakt wie im Repo:
  const PDF_FILE = 'broschuere_cleaning_station_chantal_weis.pdf?v=4';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  let pdfDoc = null;
  let pageNum = 1;

  const canvas = document.getElementById('pdf');
  const ctx = canvas.getContext('2d');

  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const pageNumEl = document.getElementById('page-num');
  const pageCountEl = document.getElementById('page-count');

  function getScale(page){
    const v1 = page.getViewport({ scale: 1 });

    const containerMaxWidth = Math.min(1200, window.innerWidth) - 40; // wrap padding
    const containerMaxHeight = window.innerHeight - 190; // controls + margins

    const isPortrait = v1.height > v1.width;

    // Doppelseiten (quer) dürfen fit-to-width machen
    // Einzelseiten (hoch) werden nicht unbegrenzt hochskaliert
    const portraitMaxWidth = Math.min(720, containerMaxWidth); // <- hier steuert man "Cover nicht zu groß"

    const targetWidth = isPortrait ? portraitMaxWidth : containerMaxWidth;

    const scaleByWidth = targetWidth / v1.width;
    const scaleByHeight = containerMaxHeight / v1.height;

    return Math.min(scaleByWidth, scaleByHeight, 2.6);
  }

  async function renderPage(num){
    const page = await pdfDoc.getPage(num);

    const scale = getScale(page);
    const viewport = page.getViewport({ scale });

    canvas.width = Math.floor(viewport.width);
    canvas.height = Math.floor(viewport.height);

    await page.render({ canvasContext: ctx, viewport }).promise;

    pageNumEl.textContent = num;
    prevBtn.disabled = (num <= 1);
    nextBtn.disabled = (num >= pdfDoc.numPages);
  }

  (async () => {
    pdfDoc = await pdfjsLib.getDocument(PDF_FILE).promise;
    pageCountEl.textContent = pdfDoc.numPages;
    await renderPage(pageNum);
  })();

  prevBtn.addEventListener('click', async () => {
    if(pageNum <= 1) return;
    pageNum--;
    await renderPage(pageNum);
  });

  nextBtn.addEventListener('click', async () => {
    if(pageNum >= pdfDoc.numPages) return;
    pageNum++;
    await renderPage(pageNum);
  });

  window.addEventListener('resize', () => {
    if(pdfDoc) renderPage(pageNum);
  });
</script>
</body>
</html>
