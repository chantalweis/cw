<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broschüre</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#111;
font-family:Arial, sans-serif;
}

.viewer{
width:100vw;
height:100vh;
display:flex;
overflow-x:auto;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
scroll-behavior:smooth;
}

.viewer::-webkit-scrollbar{
display:none;
}

.page{
flex:0 0 100vw;
width:100vw;
height:100vh;
scroll-snap-align:start;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.zoom-container{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.zoom-container img{
width:100%;
height:100%;
object-fit:contain;
transform-origin:center center;
user-select:none;
-webkit-user-drag:none;
}

.counter{
position:fixed;
bottom:18px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,0.6);
color:white;
padding:8px 14px;
border-radius:20px;
font-size:14px;
z-index:20;
}

/* unsichtbare Safari-Zurück Blocker */

.edge-block{
position:fixed;
top:0;
height:100vh;
width:70px;
z-index:30;
}

.edge-left{
left:0;
}

.edge-right{
right:0;
}

</style>
</head>

<body>

<div class="edge-block edge-left"></div>
<div class="edge-block edge-right"></div>

<div class="viewer" id="viewer">

<div class="page"><div class="zoom-container"><img src="seite__Seite_01.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_02.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_03.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_04.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_05.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_06.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_07.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_08.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_09.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_10.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_11.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_12.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_13.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_14.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_15.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_16.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_17.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_18.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_19.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_20.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_21.jpg"></div></div>
<div class="page"><div class="zoom-container"><img src="seite__Seite_22.jpg"></div></div>

</div>

<div class="counter" id="counter">1 / 22</div>

<script>

const viewer = document.getElementById("viewer")
const counter = document.getElementById("counter")

viewer.addEventListener("scroll", () => {

let page = Math.round(viewer.scrollLeft / window.innerWidth) + 1
counter.innerText = page + " / 22"

})

</script>

</body>
</html>
