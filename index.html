<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Cleaning Station – Chantal Weis</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1c1c1a;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1c1c1a;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #pageImage {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="stage" id="stage">
      <img id="pageImage" src="seite__Seite_01.jpg?v=3" alt="Broschürenseite" />
    </div>
  </div>

  <script>
    let currentPage = 1;
    const totalPages = 35;
    const version = "3";

    const img = document.getElementById("pageImage");
    const stage = document.getElementById("stage");

    function formatNumber(num) {
      return String(num).padStart(2, "0");
    }

    function getPageSrc(page) {
      return `seite__Seite_${formatNumber(page)}.jpg?v=${version}`;
    }

    function updatePage() {
      img.src = getPageSrc(currentPage);
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        updatePage();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        updatePage();
      }
    }

    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    function applyTransform() {
      img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform();
    }

    function clampPan() {
      if (scale <= 1) {
        translateX = 0;
        translateY = 0;
        return;
      }

      const maxX = Math.max((img.clientWidth * scale - window.innerWidth) / 2, 0);
      const maxY = Math.max((img.clientHeight * scale - window.innerHeight) / 2, 0);

      translateX = Math.min(Math.max(translateX, -maxX), maxX);
      translateY = Math.min(Math.max(translateY, -maxY), maxY);
    }

    let mouseDownX = 0;
    let mouseDownY = 0;
    let mouseMoved = false;

    document.addEventListener("mousedown", (e) => {
      mouseDownX = e.clientX;
      mouseDownY = e.clientY;
      mouseMoved = false;
    });

    document.addEventListener("mousemove", (e) => {
      if (Math.abs(e.clientX - mouseDownX) > 8 || Math.abs(e.clientY - mouseDownY) > 8) {
        mouseMoved = true;
      }
    });

    document.addEventListener("click", (e) => {
      if (mouseMoved || scale > 1) return;

      const half = window.innerWidth / 2;
      if (e.clientX > half) nextPage();
      else prevPage();
    });

    let touchStartX = 0;
    let touchStartY = 0;
    let touchMoved = false;
    let isPinching = false;

    let initialPinchDistance = null;
    let initialScale = 1;

    function getDistance(t1, t2) {
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    stage.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchMoved = false;
        isPinching = false;
      }

      if (e.touches.length === 2) {
        isPinching = true;
        initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
        initialScale = scale;
      }
    }, { passive: false });

    stage.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        isPinching = true;

        const newDistance = getDistance(e.touches[0], e.touches[1]);
        scale = initialScale * (newDistance / initialPinchDistance);
        scale = Math.max(1, Math.min(scale, 5));
        clampPan();
        applyTransform();
        return;
      }

      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;

        if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
          touchMoved = true;
        }
      }
    }, { passive: false });

    stage.addEventListener("touchend", (e) => {
      if (isPinching) {
        isPinching = false;
        return;
      }

      if (scale > 1) return;
      if (e.changedTouches.length !== 1) return;

      const endX = e.changedTouches[0].clientX;
      const endY = e.changedTouches[0].clientY;

      const diffX = touchStartX - endX;
      const diffY = touchStartY - endY;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
        if (diffX > 0) nextPage();
        else prevPage();
        return;
      }

      const tapDistance = Math.sqrt(
        Math.pow(endX - touchStartX, 2) + Math.pow(endY - touchStartY, 2)
      );

      if (!touchMoved && tapDistance < 10) {
        const half = window.innerWidth / 2;
        if (endX > half) nextPage();
        else prevPage();
      }
    });

    document.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();

      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      scale = Math.max(1, Math.min(scale * factor, 5));
      clampPan();
      applyTransform();
    }, { passive: false });

    document.addEventListener("dblclick", (e) => {
      e.preventDefault();

      if (scale === 1) scale = 2;
      else resetZoom();

      clampPan();
      applyTransform();
    });

    img.addEventListener("load", () => {
      if (scale === 1) {
        translateX = 0;
        translateY = 0;
        applyTransform();
      }
    });

    img.src = getPageSrc(currentPage);
  </script>
</body>
</html>
