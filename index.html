<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Cleaning Station – Chantal Weis</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1c1c1a;
      overflow: hidden;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    .viewer {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1c1c1a;
    }

    .stage {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #pageImage {
      max-width: 100vw;
      max-height: 100vh;
      object-fit: contain;
      transform-origin: center center;
      user-select: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="viewer">
    <div class="stage" id="stage">
      <img id="pageImage" src="seite__Seite_01.jpg?v=2" />
    </div>
  </div>

  <script>
    let currentPage = 1;
    const totalPages = 35;

    // 👉 WICHTIG: Version ändern wenn du Bilder updatest
    const version = "2";

    const img = document.getElementById("pageImage");
    const stage = document.getElementById("stage");

    function formatNumber(num) {
      return String(num).padStart(2, "0");
    }

    function getPageSrc(page) {
      return `seite__Seite_${formatNumber(page)}.jpg?v=${version}`;
    }

    function updatePage() {
      img.src = getPageSrc(currentPage);
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        updatePage();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        updatePage();
      }
    }

    let scale = 1;
    let translateX = 0;
    let translateY = 0;

    function applyTransform() {
      img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    function resetZoom() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      applyTransform();
    }

    function clampPan() {
      if (scale <= 1) {
        translateX = 0;
        translateY = 0;
        return;
      }

      const maxX = (img.clientWidth * scale - window.innerWidth) / 2;
      const maxY = (img.clientHeight * scale - window.innerHeight) / 2;

      translateX = Math.min(Math.max(translateX, -maxX), maxX);
      translateY = Math.min(Math.max(translateY, -maxY), maxY);
    }

    // 👉 verhindert Seitenwechsel nach Zoom
    let hasInteracted = false;

    // Klick Navigation
    document.addEventListener("click", (e) => {
      if (hasInteracted || scale > 1) {
        hasInteracted = false;
        return;
      }

      const half = window.innerWidth / 2;
      if (e.clientX > half) nextPage();
      else prevPage();
    });

    // Touch / Swipe / Zoom
    let touchStartX = 0;
    let touchStartY = 0;

    let initialPinchDistance = null;
    let initialScale = 1;

    function getDistance(t1, t2) {
      const dx = t2.clientX - t1.clientX;
      const dy = t2.clientY - t1.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    stage.addEventListener("touchstart", (e) => {
      hasInteracted = false;

      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }

      if (e.touches.length === 2) {
        initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
        initialScale = scale;
      }
    }, { passive: false });

    stage.addEventListener("touchmove", (e) => {
      hasInteracted = true;

      if (e.touches.length === 2) {
        e.preventDefault();
        const newDistance = getDistance(e.touches[0], e.touches[1]);
        scale = initialScale * (newDistance / initialPinchDistance);
        scale = Math.max(1, Math.min(scale, 5));
        clampPan();
        applyTransform();
      }
    }, { passive: false });

    stage.addEventListener("touchend", (e) => {
      if (scale > 1) return;

      if (!hasInteracted && e.changedTouches.length === 1) {
        const endX = e.changedTouches[0].clientX;

        const half = window.innerWidth / 2;
        if (endX > half) nextPage();
        else prevPage();
      }

      hasInteracted = false;
    });

    // Desktop Zoom
    document.addEventListener("wheel", (e) => {
      if (!e.ctrlKey) return;
      e.preventDefault();

      hasInteracted = true;

      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      scale = Math.max(1, Math.min(scale * factor, 5));
      clampPan();
      applyTransform();
    }, { passive: false });

    // Double Click Zoom
    document.addEventListener("dblclick", (e) => {
      e.preventDefault();
      hasInteracted = true;

      if (scale === 1) scale = 2;
      else resetZoom();

      clampPan();
      applyTransform();
    });

    img.src = getPageSrc(currentPage);
  </script>
</body>
</html>
